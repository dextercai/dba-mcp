name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven build and tests
        run: ./mvnw -B -ntp verify
      - name: Validate production Compose model
        run: |
          DBA_MCP_IMAGE=example.invalid/dba-mcp@sha256:placeholder \
          DBA_MCP_API_TOKEN=ci-token \
          DBA_MCP_ALLOWED_ORIGINS=https://ci.example.invalid \
          DBA_ASSET_ADMIN_USERNAME=ci-admin \
          DBA_ASSET_ADMIN_PASSWORD_HASH='$$2a$$10$$abcdefghijklmnopqrstuuC6mThbfRzYv8jA7DRu12dv7UClW7i' \
          DBA_MCP_CONFIG_DIR=/tmp/config \
          DBA_MCP_ASSETS_FILE=/tmp/assets.db \
          DBA_MCP_KNOWN_HOSTS_FILE=/tmp/known_hosts \
          DBA_MCP_AUDIT_DIR=/tmp/audit \
          docker compose -f docker-compose.production.yml config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dba-mcp:ci

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        run: |
          echo "IMAGE=docker.cnb.cool/dextercai/docker/dba_mcp" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_DOCKER_SK }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.cnb.cool/dextercai/docker_public/dba_mcp:latest
