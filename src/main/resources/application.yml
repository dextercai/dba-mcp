spring:
  application:
    name: dba-mcp
  flyway:
    # Migration is invoked explicitly for the asset data source so read-only
    # snapshots remain untouched.
    enabled: false
    # Existing online asset stores are untracked V1 schemas.  On their first
    # upgrade Flyway records baseline V1, then applies V2 and later migrations.
    baseline-on-migrate: true
    baseline-version: "1"
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: dba-mcp
        version: 0.1.0
        type: SYNC
logging:
  level:
    com.dextercai.dbamcp: INFO
dba:
  assets:
    sqlite:
      jdbc-url: ${DBA_ASSETS_JDBC_URL:jdbc:sqlite:./data/dba-mcp-assets.db}
      read-only: ${DBA_ASSETS_READ_ONLY:false}
      busy-timeout: 5s
  http:
    api-token: ${DBA_MCP_API_TOKEN:dec19a4f-b2a9-4a2c-bf3c-22ec2d9d2cb2}
    allowed-origins: ${DBA_MCP_ALLOWED_ORIGINS:}
    # htpasswd -nBC 12 caiwzh
    asset-admin-username: ${DBA_ASSET_ADMIN_USERNAME:caiwzh}
    asset-admin-password-hash: ${DBA_ASSET_ADMIN_PASSWORD_HASH:$2y$12$5Ed64xDKgFDfuEBDRtGow.cr8cHVPSKICRkZWQ4xsqrLUzPhY3RYy}
  database:
    hikari:
      connection-timeout: 30s
      validation-timeout: 5s
      # Cold target pools are evicted; do not turn low-frequency inventory into probe traffic.
      keepalive-time: 0s
      max-lifetime: 30m
      idle-timeout: 10m
    target-pools:
      maximum-cached-pools: 128
      maximum-pool-size: 1
      cache-idle-timeout: 1m
    # This database-changing tool is disabled unless both this switch and the
    # target asset's database_detail.user_unlock_enabled are true.
    user-unlock:
      enabled: ${DBA_ORACLE_USER_UNLOCK_ENABLED:false}
